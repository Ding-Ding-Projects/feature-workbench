<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Commonplace on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;family=Noto+Sans+HK:wght@500&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,500,1,0&amp;display=swap">
<style>
body{margin:0}
a{color:#8EA2FF}a:hover{color:#B9C6FF}
button{font:inherit}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 1,'wght' 500,'opsz' 20;flex:none;width:20px;height:20px;overflow:hidden;display:inline-block}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B1220; color: #F2F5FA; font-family: Inter, 'Noto Sans HK', system-ui, sans-serif; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column">

<header style="padding: 16px 16px 8px; display: flex; align-items: center; gap: 4px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; margin-right: auto">Commonplace</span>
<button type="button" aria-label="Find an action" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #F2F5FA; display: grid; place-items: center; cursor: pointer"><span class="ms" aria-hidden="true">search</span></button>
<button type="button" aria-label="Settings" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #F2F5FA; display: grid; place-items: center; cursor: pointer"><span class="ms" aria-hidden="true">tune</span></button>
</header>

<div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 16px">
<div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.08; letter-spacing: -0.03em">Make room for your next idea.</h1>
<p style="margin: 8px 0 0; color: #A9B4C8; font-size: 14px; display: flex; align-items: center; gap: 6px"><span class="ms" aria-hidden="true" style="font-size: 16px; width: 16px; height: 16px">computer</span>Local workspace, stays in this browser</p>
</div>

<div role="tablist" aria-label="Task lanes" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #172238">
<sc-for list="{{lanes}}" as="lane" hint-placeholder-count="3">
<sc-if value="{{lane.on}}" hint-placeholder-val="{{false}}"><button type="button" role="tab" aria-selected="true" onClick="{{lane.pick}}" style="min-height: 44px; border: 0; border-radius: 10px; background: #F2F5FA; color: #0B1220; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer">{{lane.label}} <span style="font-variant-numeric: tabular-nums; color: #3B4A66">{{lane.count}}</span></button></sc-if>
<sc-if value="{{lane.off}}" hint-placeholder-val="{{true}}"><button type="button" role="tab" aria-selected="false" onClick="{{lane.pick}}" style="min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: #DCE3EE; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer">{{lane.label}} <span style="font-variant-numeric: tabular-nums; color: #A9B4C8">{{lane.count}}</span></button></sc-if>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{cards}}" as="task" hint-placeholder-count="2">
<article style="background: #172238; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35">{{task.title}}</h2>
<p style="margin: 0; color: #A9B4C8; font-size: 14px">{{task.notes}}</p>
<div style="display: flex; gap: 8px; padding-top: 12px">
<button type="button" onClick="{{task.advance}}" style="min-height: 40px; padding: 0 14px 0 10px; border: 0; border-radius: 10px; background: #26334F; color: #F2F5FA; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer"><span class="ms" aria-hidden="true" style="font-size: 18px; width: 18px; height: 18px">arrow_forward</span>{{task.next}}</button>
<button type="button" aria-label="Edit task" style="margin-left: auto; min-height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #8EA2FF; font-size: 14px; font-weight: 600; cursor: pointer">Edit</button>
</div>
</article>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="padding: 24px 16px; border-radius: 16px; border: 1px dashed #3B4A66; color: #A9B4C8; text-align: center; font-size: 14px">Nothing here yet. Move a task in, or add one.</div>
</sc-if>
</div>

<a href="Setup.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #1B2A5C; color: #F2F5FA; text-decoration: none">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<span aria-hidden="true" style="display: flex; gap: 4px"><span style="width: 24px; height: 5px; border-radius: 3px; background: #8EA2FF"></span><span style="width: 24px; height: 5px; border-radius: 3px; background: #8EA2FF"></span><span style="width: 24px; height: 5px; border-radius: 3px; background: #3B4A66"></span></span>
<span style="font-size: 14px"><strong style="font-weight: 600">Setup, step 2 of 3.</strong> <span style="color: #C9D2E3">Pick up where you left off.</span></span>
</span>
<span class="ms" aria-hidden="true" style="color: #B9C6FF">arrow_forward</span>
</a>
</div>

<div style="margin-top: auto; padding: 16px; display: flex; align-items: center; gap: 12px">
<a href="Guide.dc.html" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; text-decoration: none">Field guide<span class="ms" aria-hidden="true" style="font-size: 18px; width: 18px; height: 18px">arrow_forward</span></a>
<button type="button" style="margin-left: auto; min-height: 56px; padding: 0 22px 0 18px; border: 0; border-radius: 18px; background: #8EA2FF; color: #0B1220; font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.35)"><span class="ms" aria-hidden="true">add</span>New task</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      lane: 'doing',
      tasks: [
        { id: 'a', title: 'Export a backup before experimenting', notes: 'Tasks and preferences as one JSON file.', status: 'todo' },
        { id: 'b', title: 'Choose a comfortable text size', notes: 'Settings, then Appearance.', status: 'todo' },
        { id: 'c', title: 'Write the next useful step', notes: 'A short title. Notes are optional.', status: 'doing' },
        { id: 'e', title: 'Try the command palette', notes: 'Ctrl Shift F from anywhere.', status: 'doing' },
        { id: 'd', title: 'Pick a language', notes: 'English, Cantonese, or both.', status: 'done' },
        { id: 'f', title: 'Read the browser boundaries', notes: 'Field guide, Honest by design.', status: 'done' }
      ]
    };
  }
  renderVals() {
    const labels = { todo: 'To do', doing: 'In progress', done: 'Done' };
    const after = { todo: 'doing', doing: 'done', done: 'todo' };
    const nextLabel = { todo: 'Start', doing: 'Mark done', done: 'Reopen' };
    const lanes = ['todo', 'doing', 'done'].map((s) => ({
      label: labels[s],
      count: this.state.tasks.filter((t) => t.status === s).length,
      on: this.state.lane === s,
      off: this.state.lane !== s,
      pick: () => this.setState({ lane: s })
    }));
    const cards = this.state.tasks.filter((t) => t.status === this.state.lane).map((t) => Object.assign({}, t, {
      next: nextLabel[t.status],
      advance: () => this.setState({ tasks: this.state.tasks.map((x) => (x.id === t.id ? Object.assign({}, x, { status: after[x.status] }) : x)) })
    }));
    return { lanes: lanes, cards: cards, empty: cards.length === 0 };
  }
}
</script>
</body>
</html>
